name: Image

# Builds the t.racks Studio image for amd64 and arm64 and publishes it on GitHub's registry:
# ghcr.io/clabeuhtegrite/t.racks-studio:main (and :latest, :sha-xxxxxxx) at every merge on main,
# :x.y.z for a vX.Y.Z tag. A pull request builds it and tries the demo without publishing anything.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: t.racks-studio:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Try the demo instance
        run: |
          docker run -d --name demo -p 8080:8080 --read-only --cap-drop ALL -v demo-data:/data t.racks-studio:test demo
          ok=''
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health -o health.json; then ok=1; break; fi
            sleep 2
          done
          docker logs demo
          [ -n "$ok" ] || { echo "::error::the demo instance does not answer"; exit 1; }
          cat health.json; echo
          # the web interface is served, the demo DSP is listed (the emulated ones need Thomann's site)
          curl -fsS http://localhost:8080/ | grep -q 't.racks Studio'
          node -e '
            const h = require("./health.json");
            if (!h.ok || !h.devices.some((d) => d.spec.kind === "demo")) process.exit(1);
            console.log(h.devices.map((d) => d.label).join(", "));
          '
          docker run --rm t.racks-studio:test --help | head -n 3
          docker run --rm t.racks-studio:test demo --help | head -n 2

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build for amd64 and arm64, and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
